# Simpan sebagai: .github/workflows/metrics.yml  (di repository profil angkykurniawan/angkykurniawan)
name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]   # update tiap hari
  workflow_dispatch:                   # bisa dijalankan manual
  push: { branches: [main] }

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Repositories, stars, forks, ringkasan akun (termasuk private)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.stats.svg
          output_action: commit
          committer_branch: main
          user: angkykurniawan
          template: classic
          config_timezone: Asia/Jakarta
          base: header, activity, community, repositories, metadata
          repositories_forks: yes

      # 2) Bahasa pemrograman (public + private)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          output_action: commit
          committer_branch: main
          user: angkykurniawan
          template: classic
          config_timezone: Asia/Jakarta
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      # 3) Kalender kontribusi
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.calendar.svg
          output_action: commit
          committer_branch: main
          user: angkykurniawan
          template: classic
          config_timezone: Asia/Jakarta
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
